name: Build

# 手动触发 / 任意分支 push / 打 tag(如 v0.1.0)
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

# 创建/更新 Release 需要写权限。GitHub 对新建仓库的 workflow 默认只给
# contents: read —— 表现就是:普通 push 构建一切正常(它不发布),
# 打 tag 时却在最后的上传环节失败。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-arm64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS-x64
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            label: Windows-x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两个架构都装上,便于出 universal 或分别构建
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # sherpa-onnx 的静态库较大,缓存能省下大量时间
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # sherpa-onnx-sys 的 build.rs 自己下载预编译库,但它**只检查目录是否存在、
      # 不校验内容完整性**,且下载无校验和、无原子重命名 —— 任何中断都会留下
      # 一个"看起来已下载"的坏缓存,之后表现为
      # "could not find native static library sherpa-onnx-c-api"。
      #
      # 因此这里把下载接管过来:显式 curl(带重试、有日志),再通过
      # SHERPA_ONNX_ARCHIVE_DIR 指给 build.rs,BUILD 阶段直接解压本地归档。
      - name: 清理 sherpa-onnx 预编译库缓存
        shell: bash
        run: rm -rf app/src-tauri/target/sherpa-onnx-prebuilt

      - name: 预下载 sherpa-onnx 预编译库
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          VER=1.13.8
          case "${{ matrix.label }}" in
            macOS-arm64) A="sherpa-onnx-v${VER}-osx-arm64-static-lib.tar.bz2" ;;
            macOS-x64)   A="sherpa-onnx-v${VER}-osx-x64-static-lib.tar.bz2" ;;
            Windows-x64) A="sherpa-onnx-v${VER}-win-x64-static-MT-Release-lib.tar.bz2" ;;
            *) echo "未知平台 ${{ matrix.label }}"; exit 1 ;;
          esac
          mkdir -p .sherpa-archives
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VER}/${A}"
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
               -o ".sherpa-archives/${A}" "$URL"
          # bzip2 完整性校验:解压测试能捕获截断的下载
          bzip2 -t ".sherpa-archives/${A}"
          ls -lh .sherpa-archives/

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 下载模型并裁剪
        working-directory: app
        shell: bash
        run: ./scripts/fetch-model-ci.sh

      # 只做构建;发布统一交给末尾的 release job(避免各平台并发创建 Release)
      - name: 构建
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/app/.sherpa-archives
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: 诊断(构建失败时输出预编译库状态)
        if: failure()
        shell: bash
        run: |
          echo "--- 归档目录 ---"
          ls -lh app/.sherpa-archives/ 2>/dev/null || echo "(空)"
          echo "--- 解压后的库 ---"
          find app/src-tauri/target/sherpa-onnx-prebuilt -name "*.a" 2>/dev/null | head -10 || echo "(无)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/macos/*.app
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tauri 的 android init 会按需使用这几个 target,一次装齐避免中途失败
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # 与 desktop job 同样的处理:sherpa-onnx-sys 的 build.rs 只检查目录存在、
      # 不校验内容,下载也无校验和 —— 中断后留下"看起来已下载"的坏缓存,
      # 表现为链接失败(找不到 -lsherpa-onnx-c-api / -lonnxruntime)。
      # 这里由 CI 显式下载并做 bzip2 完整性校验,再交给 build.rs 解压。
      - name: 清理 sherpa-onnx 预编译库缓存
        shell: bash
        run: rm -rf app/src-tauri/target/sherpa-onnx-prebuilt

      - name: 预下载 sherpa-onnx 预编译库(Android)
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          VER=1.13.8
          # Android 是单个归档覆盖所有 ABI(内含 jniLibs/<abi>/)
          A="sherpa-onnx-v${VER}-android.tar.bz2"
          mkdir -p .sherpa-archives
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VER}/${A}"
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
               -o ".sherpa-archives/${A}" "$URL"
          bzip2 -t ".sherpa-archives/${A}"
          ls -lh .sherpa-archives/

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 本地开发用的是 NDK 28.2.13676358(= r28b),CI 保持同版本避免行为差异
      - name: 安装 Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 下载模型并裁剪
        working-directory: app
        shell: bash
        run: ./scripts/fetch-model-ci.sh

      # gen/ 已被 .gitignore 排除,Android 工程在 CI 上现生成
      - name: 初始化 Android 工程
        working-directory: app
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android init

      # gen/ 每次都是全新的,所以对 Gradle 工程的改动(混淆、签名)靠脚本重放
      - name: 修补 Android 工程(混淆与签名)
        working-directory: app
        shell: bash
        run: ./scripts/patch-android-release.sh

      # release 构建:开启混淆与资源收缩,使用 debug 签名(可直接装机测试)。
      # 正式发布时把 patch 脚本里的 signingConfig 换成 release keystore。
      - name: 构建 release APK
        working-directory: app
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/app/.sherpa-archives
        run: npx tauri android build --target aarch64 --apk

      - name: 诊断(构建失败时输出预编译库状态)
        if: failure()
        shell: bash
        run: |
          echo "--- 归档目录 ---"
          ls -lh app/.sherpa-archives/ 2>/dev/null || echo "(空)"
          echo "--- 解压后的库 ---"
          find app/src-tauri/target/sherpa-onnx-prebuilt \( -name "*.so" -o -name "*.a" \) 2>/dev/null | head -10 || echo "(无)"

      - name: 上传 APK(构建产物)
        uses: actions/upload-artifact@v4
        with:
          name: tts-Android-arm64
          if-no-files-found: warn
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # 打 tag 时,把各平台产物汇总成一个 Release 发布。
  #
  # 为什么单开一个 job 而不是让各平台自己上传:
  #   1. 三个桌面 job 并发创建同一个 Release 会竞态(谁先谁创建、后来者可能冲突)
  #   2. 发布逻辑集中一处,失败时一眼能看出是"构建问题"还是"发布问题"
  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出待发布文件
        run: find dist -type f | sort

      # 只挑安装包,排除 .app 目录之类的非文件产物
      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: 文字转语音 ${{ github.ref_name }}
          body: |
            本地离线文字转语音,模型内置,无需联网。

            **下载哪个**
            - macOS:`*_aarch64.dmg`(Apple Silicon)/ `*_x64.dmg`(Intel)
            - Windows:`.msi` 或 `-setup.exe`
            - Android:`.apk`(debug 签名,安装时需允许"未知来源")

            **macOS 首次打开提示"已损坏"**,在终端执行一次:
            ```
            xattr -cr /Applications/TTS.app
            ```
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.apk
          draft: false
          prerelease: false
