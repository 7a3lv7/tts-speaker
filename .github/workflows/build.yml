name: Build

# 手动触发 / 任意分支 push / 打 tag(如 v0.1.0)
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-arm64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS-x64
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            label: Windows-x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两个架构都装上,便于出 universal 或分别构建
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # sherpa-onnx 的静态库较大,缓存能省下大量时间
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 下载模型并裁剪
        working-directory: app
        shell: bash
        run: ./scripts/fetch-model-ci.sh

      - name: 构建
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/macos/*.app
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
