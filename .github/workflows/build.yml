name: Build

# 手动触发 / 任意分支 push / 打 tag(如 v0.1.0)
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-arm64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS-x64
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            label: Windows-x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两个架构都装上,便于出 universal 或分别构建
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # sherpa-onnx 的静态库较大,缓存能省下大量时间
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # sherpa-onnx-sys 的 build.rs 自己下载预编译库,但它**只检查目录是否存在、
      # 不校验内容完整性**,且下载无校验和、无原子重命名 —— 任何中断都会留下
      # 一个"看起来已下载"的坏缓存,之后表现为
      # "could not find native static library sherpa-onnx-c-api"。
      #
      # 因此这里把下载接管过来:显式 curl(带重试、有日志),再通过
      # SHERPA_ONNX_ARCHIVE_DIR 指给 build.rs,BUILD 阶段直接解压本地归档。
      - name: 清理 sherpa-onnx 预编译库缓存
        shell: bash
        run: rm -rf app/src-tauri/target/sherpa-onnx-prebuilt

      - name: 预下载 sherpa-onnx 预编译库
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          VER=1.13.8
          case "${{ matrix.label }}" in
            macOS-arm64) A="sherpa-onnx-v${VER}-osx-arm64-static-lib.tar.bz2" ;;
            macOS-x64)   A="sherpa-onnx-v${VER}-osx-x64-static-lib.tar.bz2" ;;
            Windows-x64) A="sherpa-onnx-v${VER}-win-x64-static-MT-Release-lib.tar.bz2" ;;
            *) echo "未知平台 ${{ matrix.label }}"; exit 1 ;;
          esac
          mkdir -p .sherpa-archives
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VER}/${A}"
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
               -o ".sherpa-archives/${A}" "$URL"
          # bzip2 完整性校验:解压测试能捕获截断的下载
          bzip2 -t ".sherpa-archives/${A}"
          ls -lh .sherpa-archives/

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 下载模型并裁剪
        working-directory: app
        shell: bash
        run: ./scripts/fetch-model-ci.sh

      - name: 构建
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/app/.sherpa-archives
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: 诊断(构建失败时输出预编译库状态)
        if: failure()
        shell: bash
        run: |
          echo "--- 归档目录 ---"
          ls -lh app/.sherpa-archives/ 2>/dev/null || echo "(空)"
          echo "--- 解压后的库 ---"
          find app/src-tauri/target/sherpa-onnx-prebuilt -name "*.a" 2>/dev/null | head -10 || echo "(无)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/macos/*.app
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tauri 的 android init 会按需使用这几个 target,一次装齐避免中途失败
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # 与 desktop job 同样的处理:sherpa-onnx-sys 的 build.rs 只检查目录存在、
      # 不校验内容。缓存不完整时会跳过下载,随后要么链接失败(桌面),
      # 要么 panic "No shared runtime libraries found"(Android)。
      - name: 清理 sherpa-onnx 预编译库缓存
        shell: bash
        run: rm -rf app/src-tauri/target/sherpa-onnx-prebuilt

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 本地开发用的是 NDK 28.2.13676358(= r28b),CI 保持同版本避免行为差异
      - name: 安装 Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 下载模型并裁剪
        working-directory: app
        shell: bash
        run: ./scripts/fetch-model-ci.sh

      # gen/ 已被 .gitignore 排除,Android 工程在 CI 上现生成
      - name: 初始化 Android 工程
        working-directory: app
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android init

      # gen/ 每次都是全新的,所以对 Gradle 工程的改动(混淆、签名)靠脚本重放
      - name: 修补 Android 工程(混淆与签名)
        working-directory: app
        shell: bash
        run: ./scripts/patch-android-release.sh

      # release 构建:开启混淆与资源收缩,使用 debug 签名(可直接装机测试)。
      # 正式发布时把 patch 脚本里的 signingConfig 换成 release keystore。
      - name: 构建 release APK
        working-directory: app
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android build --target aarch64 --apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tts-Android-arm64
          if-no-files-found: warn
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
