<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>文字转语音</title>
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --surface-2: #fafafb;
    --text: #1b1b1f;
    --muted: #71717a;
    --border: #e3e3e8;
    --accent: #3563e9;
    --danger: #c8382f;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --surface: #1b1b20;
      --surface-2: #232329;
      --text: #ededf2;
      --muted: #97979f;
      --border: #2c2c33;
      --accent: #6d8dff;
      --danger: #ff6b61;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: .01em; margin: 0 0 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: inherit;
    font: inherit;
    line-height: 1.7;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .row > label { flex: none; width: 40px; font-size: 13px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  output {
    flex: none;
    width: 48px;
    text-align: right;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    cursor: pointer;
  }
  select {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: inherit;
    font: inherit;
  }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button {
    padding: 10px 18px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost:hover:not(:disabled) { background: var(--surface-2); filter: none; }
  #export { margin-left: auto; }
  #status {
    min-height: 20px;
    margin: 14px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #status.error { color: var(--danger); }
  @media (max-width: 520px) {
    main { padding: 24px 14px 48px; }
    .actions button { flex: 1 1 calc(50% - 5px); }
    #export { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>文字转语音</h1>
  <div class="card">
    <textarea id="text" maxlength="5000"
      placeholder="在这里输入或粘贴文字…"></textarea>
    <div class="meta">
      <span id="count">0 / 5000 字</span>
      <span id="engine">引擎:系统语音</span>
    </div>
    <div class="row">
      <label for="rate">语速</label>
      <input type="range" id="rate" min="0.5" max="3" step="0.1" value="1">
      <output id="rateValue" title="点击复位到 1.0x">1.0x</output>
    </div>
    <div class="row">
      <label for="voice">声音</label>
      <select id="voice"></select>
    </div>
    <div class="actions">
      <button id="play" disabled>▶ 播放</button>
      <button id="pause" hidden>⏸ 暂停</button>
      <button id="stop" class="ghost" disabled>⏹ 停止</button>
      <button id="export" class="ghost" disabled>⤓ 导出</button>
    </div>
    <p id="status" role="status"></p>
  </div>
</main>
<script>
(() => {
  'use strict';
  // ---- 常量 ----
  const MAX_CHARS = 5000;
  const MAX_CHUNK = 200;   // 单块上限,防止 Chrome 截断朗读
  const MIN_CHUNK = 60;    // 短于此时不在句末切,避免停顿过碎
  const SENTENCE_END = '。！？!?；;…';

  // ---- 环境检测 ----
  const SUPPORTED = typeof window.speechSynthesis !== 'undefined'
    && typeof window.SpeechSynthesisUtterance !== 'undefined';

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  // ---- chunker:把长文本切成适合朗读的小块 ----
  function chunk(text) {
    const out = [];
    let buf = '';
    for (const ch of String(text)) {
      if (ch === '\n') {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
        continue;
      }
      buf += ch;
      const tooLong = buf.length >= MAX_CHUNK;
      const endsSentence = SENTENCE_END.includes(ch) && buf.length >= MIN_CHUNK;
      if (tooLong || endsSentence) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  // ---- voices:系统发音人列表 ----
  const voices = {
    all: [],
    sort(list) {
      const rank = v => {
        const l = (v.lang || '').toLowerCase();
        if (l.startsWith('zh')) return 0;
        if (l.startsWith('en')) return 1;
        return 2;
      };
      return [...list].sort((a, b) =>
        rank(a) - rank(b) ||
        (a.lang || '').localeCompare(b.lang || '') ||
        (a.name || '').localeCompare(b.name || ''));
    },
    load() {
      this.all = this.sort(window.speechSynthesis.getVoices() || []);
      return this.all;
    },
    get(uri) {
      return this.all.find(v => v.voiceURI === uri) || null;
    }
  };

  const voiceSelect = document.getElementById('voice');

  function renderVoices() {
    const groups = new Map();
    for (const v of voices.load()) {
      const key = v.lang || '其他';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(v);
    }
    voiceSelect.innerHTML = '';
    for (const [lang, items] of groups) {
      const og = document.createElement('optgroup');
      og.label = lang;
      for (const v of items) {
        const o = document.createElement('option');
        o.value = v.voiceURI;
        o.textContent = v.name;
        og.append(o);
      }
      voiceSelect.append(og);
    }
    return voices.all.length;
  }

  // ---- speaker:分块朗读队列 ----
  const speaker = {
    queue: [],
    index: 0,
    state: 'idle',        // idle | playing | paused
    rate: 1,
    voiceURI: '',
    generation: 0,
    onStateChange: null,  // 由 UI 层赋值

    setState(s) {
      this.state = s;
      if (this.onStateChange) this.onStateChange(s);
    },

    // 内部:清空队列并让所有旧回调失效,不通知 UI
    _reset() {
      this.generation++;
      const s = window.speechSynthesis;
      // Chrome 在 paused 状态下 cancel 可能不生效,先 resume 再 cancel
      if (s.paused) s.resume();
      s.cancel();
      this.queue = [];
      this.index = 0;
    },

    start(text) {
      this._reset();
      this.queue = chunk(text);
      this.index = 0;
      if (!this.queue.length) { this.setState('idle'); return; }
      this.setState('playing');
      this.speakCurrent(this.generation);
    },

    speakCurrent(gen) {
      if (gen !== this.generation) return;
      const piece = this.queue[this.index];
      if (piece === undefined) { this.setState('idle'); return; }

      const u = new SpeechSynthesisUtterance(piece);
      u.rate = this.rate;
      const v = voices.get(this.voiceURI);
      if (v) { u.voice = v; u.lang = v.lang; }

      u.onend = () => {
        if (gen !== this.generation) return;   // 已被 stop()/start() 取消
        this.index++;
        this.speakCurrent(gen);
      };
      u.onerror = (e) => {
        if (gen !== this.generation) return;
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        console.warn('朗读出错:', e.error);
        this.stop();
      };

      window.speechSynthesis.speak(u);
    },

    pause() {
      if (this.state !== 'playing') return;
      window.speechSynthesis.pause();
      this.setState('paused');
    },

    resume() {
      if (this.state !== 'paused') return;
      window.speechSynthesis.resume();
      this.setState('playing');
    },

    stop() {
      this._reset();
      this.setState('idle');
    }
  };

  // ---- recorder:录制标签页音频并导出为 webm ----
  // speechSynthesis 不暴露音频数据,只能用 getDisplayMedia 捕获本标签页声音再录。
  const recorder = {
    mr: null,
    stream: null,
    chunks: [],
    onFinish: null,   // 由 UI 层赋值:(reason) => void,reason 为 saved/aborted/empty

    supported() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return false;
      if (typeof MediaRecorder === 'undefined') return false;
      // Safari 的 getDisplayMedia 拿不到音轨,直接判不支持
      const ua = navigator.userAgent;
      const isSafari = /safari/i.test(ua) && !/chrome|chromium|edg|android/i.test(ua);
      return !isSafari;
    },

    pickMime() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      return candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
    },

    async start() {
      // Chrome 要求同时请求 video,才能共享标签页音频
      this.stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audioTracks = this.stream.getAudioTracks();
      if (!audioTracks.length) {
        this.release();
        throw new Error('NO_AUDIO');
      }
      // 用户点浏览器共享栏的「停止共享」时,音轨会 ended
      audioTracks[0].addEventListener('ended', () => this.abort());

      const mimeType = this.pickMime();
      this.mr = new MediaRecorder(new MediaStream(audioTracks), mimeType ? { mimeType } : undefined);
      this.chunks = [];
      this.mr.ondataavailable = (e) => {
        if (e.data && e.data.size) this.chunks.push(e.data);
      };
      this.mr.onstop = () => this.save(mimeType);
      this.mr.start();
    },

    release() {
      if (this.stream) {
        this.stream.getTracks().forEach(t => t.stop());
        this.stream = null;
      }
    },

    save(mimeType) {
      const type = mimeType || 'audio/webm';
      this.release();
      const chunks = this.chunks;
      this.chunks = [];
      if (!chunks.length) { this.onFinish && this.onFinish('empty'); return; }
      const blob = new Blob(chunks, { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tts-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')
        + (type.includes('mp4') ? '.m4a' : '.webm');
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      this.onFinish && this.onFinish('saved');
    },

    // 共享被中止:丢弃数据,不下载
    abort() {
      this.chunks = [];
      if (this.mr && this.mr.state !== 'inactive') {
        this.mr.onstop = null;
        this.mr.stop();
      }
      this.release();
      this.onFinish && this.onFinish('aborted');
    },

    stop() {
      if (this.mr && this.mr.state !== 'inactive') this.mr.stop();
      else this.release();
    }
  };

  // ---- UI:元素引用与通用工具 ----
  const textEl = document.getElementById('text');
  const countEl = document.getElementById('count');
  const statusEl = document.getElementById('status');
  const btnPlay = document.getElementById('play');
  const btnPause = document.getElementById('pause');
  const btnStop = document.getElementById('stop');
  const btnExport = document.getElementById('export');

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function refresh() {
    countEl.textContent = textEl.value.length + ' / ' + MAX_CHARS + ' 字';
    btnPlay.disabled = !textEl.value.trim() || speaker.state !== 'idle';
    refreshExportButton();
  }

  // ---- UI:语速 ----
  const rateEl = document.getElementById('rate');
  const rateValueEl = document.getElementById('rateValue');

  function applyRate(value) {
    const rate = Math.min(3, Math.max(0.5, Number(value) || 1));
    speaker.rate = rate;
    rateValueEl.textContent = rate.toFixed(1) + 'x';
    return rate;
  }

  rateEl.addEventListener('input', () => applyRate(rateEl.value));
  // 点击数值复位到 1.0x
  rateValueEl.addEventListener('click', () => {
    rateEl.value = '1';
    applyRate(1);
  });
  applyRate(rateEl.value);

  // ---- UI:播放状态映射到按钮 ----
  speaker.onStateChange = (state) => {
    const active = state === 'playing' || state === 'paused';
    btnPlay.hidden = active;
    btnPause.hidden = !active;
    btnPause.textContent = state === 'paused' ? '▶ 继续' : '⏸ 暂停';
    btnStop.disabled = state === 'idle';
    textEl.readOnly = state !== 'idle';
    // 朗读自然播完或被停止时,收尾录制
    if (state === 'idle' && recording) recorder.stop();
    refresh();
  };

  btnPlay.addEventListener('click', () => {
    const text = textEl.value.trim();
    if (!text) return;
    setStatus('');
    speaker.voiceURI = voiceSelect.value;
    speaker.start(text);
  });

  btnPause.addEventListener('click', () => {
    if (speaker.state === 'playing') speaker.pause();
    else if (speaker.state === 'paused') speaker.resume();
  });

  btnStop.addEventListener('click', () => speaker.stop());

  textEl.addEventListener('input', refresh);

  // ---- UI:导出(录制标签页音频) ----
  let recording = false;

  function refreshExportButton() {
    if (!recorder.supported()) {
      btnExport.disabled = true;
      btnExport.title = '当前浏览器不支持捕获标签页音频,需要桌面版 Chrome 或 Edge';
      return;
    }
    btnExport.title = '录制本次朗读并下载为 webm';
    btnExport.disabled = recording ? false : (!textEl.value.trim() || speaker.state !== 'idle');
  }

  recorder.onFinish = (reason) => {
    recording = false;
    btnExport.textContent = '⤓ 导出';
    refreshExportButton();
    if (reason === 'saved') setStatus('录制完成,文件已下载。');
    else if (reason === 'aborted') setStatus('录制已中止:共享被停止。', true);
    else if (reason === 'empty') setStatus('没有录到音频,请确认共享时勾选了「分享标签页音频」。', true);
  };

  btnExport.addEventListener('click', async () => {
    if (recording) {          // 再次点击 = 立即结束(顺带停掉朗读)
      speaker.stop();
      return;
    }
    const text = textEl.value.trim();
    if (!text) return;

    const go = window.confirm(
      '导出会把本次朗读录成 webm 文件。\n\n' +
      '在接下来弹出的窗口里:\n' +
      '1. 选择「此标签页」\n' +
      '2. 务必勾选「分享标签页音频」\n\n' +
      '录制时长等于朗读时长,期间请不要静音。开始吗?'
    );
    if (!go) return;

    try {
      await recorder.start();
    } catch (err) {
      let msg;
      if (err && err.name === 'NotAllowedError') msg = '已取消共享,或没有勾选「分享标签页音频」。';
      else if (err && err.message === 'NO_AUDIO') msg = '没有拿到音频轨,请在共享时勾选「分享标签页音频」。';
      else msg = '无法开始录制:' + ((err && err.message) || String(err));
      setStatus(msg, true);
      return;
    }

    recording = true;
    btnExport.textContent = '⏹ 结束录制';
    refreshExportButton();
    setStatus('正在录制并朗读…');
    speaker.voiceURI = voiceSelect.value;
    speaker.start(text);
  });

  refresh();

  window.tts = { chunk, voices, speaker, recorder, renderVoices };
  speaker.setState('idle');

  // ---- 平台降级 ----
  if (!SUPPORTED) {
    document.querySelector('.card').innerHTML =
      '<p style="margin:0">当前浏览器不支持语音合成(Web Speech API)。' +
      '请改用桌面版 Chrome / Edge / Safari,或升级浏览器。</p>';
    return;
  }

  // iOS 的 speechSynthesis 不支持 pause / resume,直接去掉暂停按钮
  if (isIOS()) {
    speaker.pause = () => {};
    speaker.resume = () => {};
    btnPause.remove();
  }

  // ---- 语音列表加载 ----
  // Chrome 首次 getVoices() 常返回空数组,必须监听 voiceschanged 重新渲染
  voices.load();
  renderVoices();
  window.speechSynthesis.addEventListener('voiceschanged', renderVoices);
  if (!voiceSelect.options.length) setTimeout(renderVoices, 300);  // 兜底

  // 没有中文语音包时给出安装提示(voiceschanged 可能晚于首屏,故延迟复检)
  function checkChineseVoice() {
    if (!voices.all.some(v => (v.lang || '').toLowerCase().startsWith('zh'))) {
      setStatus('未检测到中文语音包。macOS:系统设置 → 辅助功能 → 朗读内容 → ' +
        '系统声音 → 管理声音,下载中文语音。', true);
    }
  }
  setTimeout(checkChineseVoice, 600);
})();
</script>
</body>
</html>
