<div class="page">
  <header class="head"></header>

  <div class="card">
    <textarea
      nz-input
      class="editor"
      rows="9"
      [maxlength]="maxChars"
      [readonly]="busy()"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
      placeholder="在这里输入或粘贴英文文字…"
      cdkTextareaAutosize
      cdkAutosizeMinRows="2"
      cdkAutosizeMaxRows="6"
    ></textarea>

    <div class="count" [class.count--limit]="atLimit()">{{ charCount() }} / {{ maxChars }} 字</div>

    <div class="field">
      <label class="field__label">语速</label>
      <nz-slider
        class="field__control"
        [ngModel]="speed()"
        (ngModelChange)="onSpeedChange($event)"
        [nzMin]="minSpeed"
        [nzMax]="maxSpeed"
        [nzStep]="0.1"
      ></nz-slider>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        class="field__value"
        title="点击复位到默认语速"
        (click)="resetSpeed()"
      >
        {{ speed().toFixed(1) }}x
      </button>
    </div>

    <div class="field">
      <label class="field__label">声音</label>
      <nz-select class="field__control" [ngModel]="sid()" (ngModelChange)="onSidChange($event)">
        @for (v of voices; track v.sid) {
        <nz-option [nzValue]="v.sid" [nzLabel]="v.name + ' · ' + v.gender" />
        }
      </nz-select>
    </div>

    <div class="actions">
      @if (state() === 'idle') {
      <button nz-button nzType="primary" [disabled]="!canPlay()" (click)="play()">播放</button>
      } @else {
      <button nz-button nzType="primary" (click)="pause()">
        {{ state() === 'paused' ? '继续' : '暂停' }}
      </button>
      }
      <button nz-button [disabled]="!busy()" (click)="stop()">停止</button>
      <button
        nz-button
        class="actions__export"
        [nzLoading]="exporting()"
        [disabled]="!canExport()"
        (click)="exportWav()"
      >
        导出 WAV
      </button>
    </div>

    @if (status()) {
    <div class="status" [class.status--error]="!!speechError()">{{ status() }}</div>
    }
  </div>
</div>
